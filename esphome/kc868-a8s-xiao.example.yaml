# Based on the user's KC868-A8S configuration; credentials stay in secrets.yaml.
esphome:
  name: kc868-a8s
  friendly_name: kc868
  comment: Swiatlo na dole

esp32:
  board: esp32dev
  framework:
    type: esp-idf

substitutions:
  heat_pump_name: rotenso
  # Directions are explicitly assigned from the ESPHome controller's perspective.
  xiao_tx_pin: GPIO15
  xiao_rx_pin: GPIO13

packages:
  xiao_uart: !include xiao-uart.package.yaml

logger:

api:
  encryption:
    key: !secret kc868_api_encryption_key

ota:
  - platform: esphome
    password: !secret kc868_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Kc868 Fallback Hotspot
    password: !secret kc868_fallback_password
captive_portal:

i2c:
  sda: 4
  scl: 5
  scan: true
  id: bus_a

one_wire:
  - platform: gpio
    pin:
      number: 14
      mode:
        input: true

pcf8574:
  - id: pcf8574_hub_out_1
    address: 0x24
  - id: pcf8574_hub_in_1
    address: 0x22

web_server:
  port: 80

switch:
  - platform: gpio
    name: out1
    id: relay1
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 0
      mode: OUTPUT
      inverted: true

  - platform: gpio
    name: out2
    id: relay2
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 1
      mode: OUTPUT
      inverted: true

  - platform: gpio
    name: out3
    id: relay3
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 2
      mode: OUTPUT
      inverted: true

  - platform: gpio
    name: out4
    id: relay4
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 3
      mode: OUTPUT
      inverted: true

  - platform: gpio
    name: out5
    id: relay5
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 4
      mode: OUTPUT
      inverted: true

  - platform: gpio
    name: out6
    id: relay6
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 5
      mode: OUTPUT
      inverted: true

  - platform: gpio
    name: out7
    id: relay7
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 6
      mode: OUTPUT
      inverted: true

  - platform: gpio
    name: out8
    id: relay8
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 7
      mode: OUTPUT
      inverted: true

binary_sensor:
  - platform: gpio
    id: input1
    name: input1
    pin:
      pcf8574: pcf8574_hub_in_1
      number: 0
      mode: INPUT
      inverted: true
    on_press:
      - script.execute: {id: xiao_send, command: "PRESS 1"}
      - homeassistant.event:
          event: esphome.868_button1_action
          data:
            action: ON_PRESS
    on_release:
      - script.execute: {id: xiao_send, command: "RELEASE 1"}
      - homeassistant.event:
          event: esphome.868_button1_action
          data:
            action: ON_PRESS_RELEASE
    # Keep the user's HA events. XIAO independently recognizes gestures at 500 ms.
    on_multi_click:
      - timing:
          - ON for at least 1s
        then:
          - homeassistant.event:
              event: esphome.868_button1_action
              data:
                action: ON_HOLD
      - timing:
          - ON for at least 1s
          - OFF for at most 0.1s
        then:
          - homeassistant.event:
              event: esphome.868_button1_action
              data:
                action: ON_HOLD_RELEASE

  - platform: gpio
    id: input2
    name: input2
    pin:
      pcf8574: pcf8574_hub_in_1
